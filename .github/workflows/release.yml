name: Release Papers

on:
  push:
    branches:
      - "codex/papers"
    paths:
      - "package.json"
      - ".github/workflows/release.yml"
    tags:
      - "v*-papers.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papers-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Molaison/llm-for-zotero-papers'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and avoid overwriting published releases
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-papers\.[0-9]+$ ]]
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag does not match package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .html_url")
          if [[ -n "$existing" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Already published: $existing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Test papers contracts
        if: steps.version.outputs.publish == 'true'
        run: node --import tsx node_modules/mocha/bin/mocha.js --require ./test/register.cjs test/cprPapersConfig.test.ts test/cprPapersRegistry.test.ts test/cprPaperHistoryDialog.test.ts test/chatStore.cprSnapshot.test.ts test/cprRichWidgets.test.ts test/cprLocalHistoryRecovery.test.ts test/reasoningProfiles.test.ts

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Check fork update target and pin release tag
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/llm-for-zotero.xpi" \
            '.addons["zotero-llm@github.com.yilewang"].updates[0].update_link == $url' .scaffold/build/update-beta.json
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish release assets
        if: steps.version.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --yes

      - name: Write release notes
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/papers-notes.md" <<'EOF'
          CPR / ChatGPT Web papers 定制版。下载 llm-for-zotero.xpi 后从 Zotero 插件管理器安装。

          保留单篇论文固定对话、首次 PDF 上传、六模型/思考强度和短标题命名。新增 GPT-6 Sol、GPT-6 Sol Instant。
          同步远端对话会用远端已保存问答替换当前聊天，并保留输入框草稿；同步后可继续在原论文会话中提问。
          新增 Zotero 内可操作的 bar/line/point 图表：经服务端输出结构化数据后，使用本地安全 SVG 渲染，支持缩放、平移、系列开关与数据表；不执行来自远端的 HTML/JS。
          对于不支持的 ChatGPT widget，仍提供原生 ChatGPT 对话链接查看。缺少原始结构化数据的远端历史无法凭纯文本重建图表。
          配套 QA2 服务修复首次 PDF 提交前内容丢失：确认尚未点击 Send 时允许一次安全重试；发送状态不明的 PDF 不自动重传。
          本 XPI Release 本身不部署 CPR 服务，不包含 API key、生产配置或用户论文。
          papers.11 起启用 Zotero 自动更新，仅从本 fork 获取新版。旧版本首次需手动安装一次，之后自动检查更新。
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --notes-file "$RUNNER_TEMP/papers-notes.md"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
