name: Papers History Safety

on:
  push:
    branches: ["codex/papers"]
  pull_request:
    branches: ["codex/papers"]

permissions:
  contents: read

jobs:
  history-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Papers history and storage regressions
        run: >-
          node --import tsx node_modules/mocha/bin/mocha.js --require ./test/register.cjs
          test/cprPapersConfig.test.ts test/cprPapersRegistry.test.ts test/cprPapersIdentity.test.ts
          test/cprPaperHistoryDialog.test.ts test/cprLocalHistoryRecovery.test.ts
          test/chatStore.cprSnapshot.test.ts
          test/conversationStoreMechanics.test.ts test/conversationKeyLedger.test.ts
      - name: Selected upstream compatibility regressions
        run: >-
          node --import tsx node_modules/mocha/bin/mocha.js --require ./test/register.cjs
          test/codexZoteroMcpServer.test.ts test/codexAppServerProcess.test.ts
          test/codexAppServerNativeClient.test.ts test/codexQuota.test.ts
          test/webSourceAttribution.test.ts test/paperWarmOnIntent.test.ts
      - name: Library context regressions
        run: >-
          node --import tsx node_modules/mocha/bin/mocha.js --require ./test/register.cjs
          test/contextSelectionActions.test.ts test/libraryChatAutoLock.test.ts
          test/zoteroItemContextMenu.test.ts test/paperPickerController.test.ts
          test/referenceSelectorArchitecture.test.ts
      - name: Build and typecheck
        run: npm run build
      - name: Architecture boundaries
        run: npm run check:architecture && npm run check:cycles
      - name: Upload compiled Zotero add-on
        uses: actions/upload-artifact@v4
        with:
          name: papers-build
          path: .scaffold/build/
          if-no-files-found: error
      - name: Reading UI regressions
        run: >-
          node --import tsx node_modules/mocha/bin/mocha.js --require ./test/register.cjs
          test/readingSidebarDesign.test.ts test/readingSidebarDesignInventory.test.ts
          test/paperSidebarPolishCss.test.ts test/runtimeSystemLayoutCss.test.ts
          test/noteFocusHeaderLayout.test.ts test/footerPermissionControl.test.ts
          test/historySearchController.test.ts test/historySearchPopupController.test.ts
          test/standaloneTabLabel.test.ts test/standaloneWindowContextFitSource.test.ts
      - name: Native reading workflows including quote expansion
        run: node scripts/run-ui-regression.mjs
